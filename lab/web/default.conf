server {
  listen 80;
  server_name localhost;

  location /recipes/ {
    alias /usr/share/nginx/lab-recipes/;
  }

  location /cubejs-api/ {
    proxy_pass http://cube:4000/cubejs-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
